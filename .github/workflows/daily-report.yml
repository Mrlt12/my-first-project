name: Daily Trading Report

on:
  schedule:
    # 10:15 UTC = 17:15 WIB, allowing time for post-close IDX data updates.
    - cron: "15 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile bot.py

      - name: Run and deliver report
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional. The verified numerical report works without Anthropic.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-5
        run: python bot.py
